services:
  postgresql:
    image: postgres:15.3-alpine
    environment:
      - POSTGRES_DB=client
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - '5432:5432'
    volumes:
      - postgresql-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d client"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - client-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - client-network

  client-api:
    container_name: client-api
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8081"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/.venv
    ports:
      - 8081:8081
    env_file:
      - ./env.dist
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - client-network

  consumer:
    container_name: client-consumer
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.consumer
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/.venv
    env_file:
      - ./env.dist
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - client-network

volumes:
  postgresql-db:

networks:
  client-network:
    name: client-network
